name: Bass Finisher Full Release QA

on:
  workflow_dispatch:
  push:
    branches:
      - v1.0.0-engineering
      - fix/v1.0.1-cpu
    paths:
      - ".github/workflows/release-plugin-tester.yml"
      - "RELEASE-AUDIT.md"
      - "CMakeLists.txt"
      - "src/**"
      - "tests/**"
      - "resource/**"

jobs:
  release-qa:
    runs-on: windows-2022

    steps:
      - name: Checkout Bass Finisher
        uses: actions/checkout@v4

      - name: Configure Bass Finisher
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin and complete internal QA
        run: cmake --build build --config Release --target BassFinisher BassFinisherDSPContractTests BassFinisherToneMatchTests BassFinisherAutomationMathTests BassFinisherBypassCrossfadeTests BassFinisherStateV1Tests BassFinisherProcessorContractTests BassFinisherRealtimeAllocationTests BassFinisherToneMatchQualityTests BassFinisherControllerContractTests BassFinisherPartitionedFIRTests BassFinisherFirCpuBenchmark --parallel

      - name: Run complete internal QA
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Locate Bass Finisher VST3
        id: bass
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "125A-Bass-Finisher-V1.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "125A-Bass-Finisher-V1.vst3 bundle not found" }
          "plugin=$($plugin.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Testing exact bundle: $($plugin.FullName)"

      - name: Verify V1.0.1 module metadata
        if: github.ref_name == 'fix/v1.0.1-cpu'
        shell: pwsh
        run: |
          $module = Get-ChildItem -Path build -Recurse -File -Filter moduleinfo.json | Where-Object { $_.FullName -match "125A-Bass-Finisher-V1.vst3" } | Select-Object -First 1
          if (-not $module) { throw "Bass moduleinfo.json missing" }
          $info = Get-Content $module.FullName -Raw
          if ($info -notmatch '"Version"\s*:\s*"1\.0\.1"') { throw "Wrong V1.0.1 module version" }

      - name: Checkout V1.0.0 final DSP baseline
        if: github.ref_name == 'fix/v1.0.1-cpu'
        uses: actions/checkout@v4
        with:
          ref: 6169717015fcecaf872be007aadbb6660fc8e00b
          path: _baseline_v100

      - name: Configure paired V1.0.0 / V1.0.1 DSP performance harness
        if: github.ref_name == 'fix/v1.0.1-cpu'
        shell: pwsh
        run: |
          $b = (Resolve-Path _baseline_v100).Path.Replace('\', '/')
          $n = (Get-Location).Path.Replace('\', '/')
          cmake -S tests/performance-matrix -B build-perf-100 -G "Visual Studio 17 2022" -A x64 "-DBASS_DSP_ROOT=$b"
          if ($LASTEXITCODE -ne 0) { throw "V1.0.0 performance configure failed" }
          cmake -S tests/performance-matrix -B build-perf-101 -G "Visual Studio 17 2022" -A x64 "-DBASS_DSP_ROOT=$n"
          if ($LASTEXITCODE -ne 0) { throw "V1.0.1 performance configure failed" }

      - name: Compile paired full-chain performance harnesses
        if: github.ref_name == 'fix/v1.0.1-cpu'
        shell: pwsh
        run: |
          cmake --build build-perf-100 --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "V1.0.0 performance build failed" }
          cmake --build build-perf-101 --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "V1.0.1 performance build failed" }

      - name: Paired full-chain CPU, p99 and sample-null regression
        if: github.ref_name == 'fix/v1.0.1-cpu'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force perf-evidence | Out-Null
          $old = "build-perf-100/Release/BassFinisherPerformanceMatrix.exe"
          $now = "build-perf-101/Release/BassFinisherPerformanceMatrix.exe"
          & $old matrix perf-evidence/baseline-cpu.csv
          if ($LASTEXITCODE -ne 0) { throw "Baseline CPU measurement failed" }
          & $now matrix perf-evidence/v101-cpu.csv
          if ($LASTEXITCODE -ne 0) { throw "Candidate CPU measurement failed" }
          & $old render perf-evidence/baseline-audio.csv
          if ($LASTEXITCODE -ne 0) { throw "Baseline audio render failed" }
          & $now render perf-evidence/v101-audio.csv
          if ($LASTEXITCODE -ne 0) { throw "Candidate audio render failed" }
          python tests/performance-matrix/compare_fullchain.py perf-evidence/baseline-cpu.csv perf-evidence/v101-cpu.csv perf-evidence/baseline-audio.csv perf-evidence/v101-audio.csv perf-evidence/verdict.json
          if ($LASTEXITCODE -ne 0) { throw "Full Bass Finisher CPU/audio A-B regression" }

      - name: Upload CPU and audio A-B measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Bass-Finisher-V1-v1.0.1-FullChain-CPU-Audio-QA
          path: perf-evidence/*
          if-no-files-found: ignore

      - name: Checkout 125A Plugin Tester v0.2.9 source
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Plugin-Tester-Final
          ref: fd246146994384e301c735e7d860b53aa06b18c5
          path: _plugin-tester

      - name: Configure 125A Plugin Tester
        shell: pwsh
        run: |
          $prefix = Join-Path (Get-Location) "_plugin-tester-installed"
          cmake -S _plugin-tester -B _plugin-tester/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="$prefix" -DSMTG_CREATE_PLUGIN_LINK=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and install 125A Plugin Tester
        run: cmake --build _plugin-tester/build --config Release --target install --parallel

      - name: Run 125A Plugin Tester v0.2.9
        shell: pwsh
        env:
          BASS_PLUGIN: ${{ steps.bass.outputs.plugin }}
        run: |
          $tester = Get-ChildItem "_plugin-tester-installed" -Recurse -File -Filter "125A_Plugin_Tester.exe" | Select-Object -First 1
          if (-not $tester) { throw "125A_Plugin_Tester.exe not found after install" }

          $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path (Get-Location) "plugin-tester-reports"
          Remove-Item $env:125A_PLUGIN_TESTER_REPORT_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:125A_PLUGIN_TESTER_REPORT_DIR | Out-Null

          $process = Start-Process -FilePath $tester.FullName -ArgumentList @($env:BASS_PLUGIN) -Wait -PassThru
          Write-Host "125A Plugin Tester exit code: $($process.ExitCode)"

          $report = Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "*_125A_QA_Report.txt" | Select-Object -First 1
          $json = Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter "*_125A_QA_Report.json" | Select-Object -First 1

          if (-not $report) { throw "125A Plugin Tester did not produce a QA report" }
          if (-not $json) { throw "125A Plugin Tester did not produce a JSON QA report" }

          Write-Host "----- 125A QA REPORT -----"
          Get-Content $report.FullName -Raw | Write-Host
          Write-Host "----- END 125A QA REPORT -----"

          $reportText = Get-Content $report.FullName -Raw
          $data = Get-Content $json.FullName -Raw | ConvertFrom-Json

          if ($data.status -ne "PASS") {
            throw "125A Plugin Tester result was $($data.status), expected PASS"
          }

          if (-not $reportText.Contains("0 WARNING / 0 FAIL")) {
            throw "125A Plugin Tester report was not clean"
          }

          if (-not $reportText.Contains("RELEASE: PASS")) {
            throw "125A Plugin Tester did not grant RELEASE: PASS"
          }

          if ($process.ExitCode -ne 0) {
            throw "125A Plugin Tester returned exit code $($process.ExitCode)"
          }

          Write-Host "125A FULL RELEASE QA: PASS"

      - name: Stage exact tested VST3
        shell: pwsh
        env:
          BASS_PLUGIN: ${{ steps.bass.outputs.plugin }}
        run: |
          Remove-Item release-artifact -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release-artifact | Out-Null
          Copy-Item -Path $env:BASS_PLUGIN -Destination release-artifact -Recurse -Force

      - name: Upload exact tested VST3
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Bass-Finisher-V1-v1.0.1-Windows-x64-Full-Release-QA
          path: release-artifact

      - name: Upload complete 125A QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Bass-Finisher-Full-Release-QA-Reports
          path: plugin-tester-reports/*
          if-no-files-found: warn
